<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LHC Event 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fafafa;
    }
    #viewer {
      width: 100vw;
      height: 80vh;
    }
    img {
      margin-top: 20px;
      width: 200px;
    }
  </style>
</head>
<body>

  <model-viewer id="viewer"
      src="./tag_1_delphes_events_vbs_view.glb"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      exposure="1"
      shadow-intensity="0">
  </model-viewer>
